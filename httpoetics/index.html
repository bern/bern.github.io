<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Fun Word Hunt</title>
    <style>
        body {
            background-image: url('https://www.transparenttextures.com/patterns/old-mathematics.png');
            font-family: 'Times New Roman', Times, serif;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .letter {
            position: absolute;
            font-size: 24px;
            transition: transform 0.2s, left 0.2s, top 0.2s, opacity 1s;
            cursor: pointer;
        }
        .letter:hover {
            transform: scale(1.5);
        }
        .trail-container {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 5px;
            border-radius: 5px;
        }
        .free-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 5px 10px;
            background-color: #ff6347;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none;
            transition: transform 0.2s, padding 0.2s, font-size 0.2s;
            font-size: 6px;
        }
    </style>
</head>
<body>
    <script>
        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const body = document.body;
        const numLetters = 50;
        let trail = [];
        let trailContainer = document.createElement('div');
        trailContainer.className = 'trail-container';
        body.appendChild(trailContainer);

        let freeButton = document.createElement('button');
        freeButton.className = 'free-button';
        freeButton.textContent = 'Set Them Free';
        body.appendChild(freeButton);

        let definitionContainer = document.createElement('div');
        definitionContainer.className = 'definition-container';
        definitionContainer.style.position = 'absolute';
        definitionContainer.style.top = '50px';
        definitionContainer.style.left = '10px';
        definitionContainer.style.backgroundColor = 'rgba(255, 255, 255, 0.8)';
        definitionContainer.style.padding = '5px';
        definitionContainer.style.borderRadius = '5px';
        body.appendChild(definitionContainer);

        let dictionary = {};

        // window.addEventListener('load', async () => {
        //     const response = await fetch('./dictionary.json');
        //     dictionary = await response.json();
        // });

        definitionContainer.style.maxWidth = '240px';
        trailContainer.style.position = 'relative';
        definitionContainer.style.position = 'relative';

        freeButton.addEventListener('click', () => {
            trail.forEach((trailLetter) => {
                trailLetter.style.transition = 'transform 1s, left 1s, top 1s, opacity 1s';
                trailLetter.style.left = Math.random() * 100 + 'vw';
                trailLetter.style.top = Math.random() * 100 + 'vh';
                trailLetter.style.transform = 'scale(1)';
                trailLetter.style.opacity = '0';
                trailLetter.style.pointerEvents = 'none';
                setTimeout(() => {
                    trailLetter.remove();
                }, 1000);
            });
            trail = [];
            trailContainer.textContent = '';
            definitionContainer.textContent = ''; // Clear the definition
            freeButton.style.display = 'none';
            freeButton.style.transform = 'translate(-50%, -50%) scale(1)';
            freeButton.style.padding = '5px 10px';
            freeButton.style.fontSize = '6px';
            collectButton = document.getElementById('collect-button');
            if (collectButton) {
                collectButton.style.display = 'none';
                collectButton.remove();
                collectButton = null;
            }
        });

        let container = document.createElement('div');
        container.style.display = 'flex';
        container.style.flexDirection = 'column';
        container.style.alignItems = 'flex-start';
        container.style.position = 'absolute';
        container.style.top = '10px';
        container.style.left = '10px';
        body.appendChild(container);

        container.appendChild(trailContainer);
        container.appendChild(definitionContainer);

        let collectButton = null;

        let score = 0;
        const scoreDisplay = document.createElement('div');
        scoreDisplay.style.position = 'relative';
        scoreDisplay.style.top = '10px';
        scoreDisplay.style.right = '10px';
        scoreDisplay.style.backgroundColor = 'rgba(255, 255, 255, 0.8)';
        scoreDisplay.style.padding = '5px';
        scoreDisplay.style.borderRadius = '5px';
        scoreDisplay.textContent = `Score: ${score}`;
        body.appendChild(scoreDisplay);

        function playSound() {
            const audio = new Audio('./sword.mp3');
            audio.play();
        }

        function flashScreen() {
            body.style.backgroundColor = 'red';
            setTimeout(() => {
                body.style.backgroundColor = '';
            }, 100);
        }

        async function checkWordAndDisplay() {
            if (trail.length < 3) return; // Ensure at least three letters are collected
            const collectedWord = trail.map(l => l.textContent).join('').toLowerCase();
            console.log({ collectedWord });
            try {
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${collectedWord}`);
                if (!response.ok) throw new Error('Word not found');
                const data = await response.json();
                console.log({ data });
                const definition = data[0].meanings[0].definitions[0].definition;
                definitionContainer.textContent = `Definition: ${definition}`;
                trailContainer.style.color = 'darkgreen';
                if (!collectButton) {
                    collectButton = document.createElement('button');
                    collectButton.id = 'collect-button';
                    collectButton.textContent = 'SCORE! SCORE! SCORE!';
                    collectButton.style.padding = '10px 20px';
                    collectButton.style.backgroundColor = 'darkgreen';
                    collectButton.style.color = 'white';
                    collectButton.style.border = 'none';
                    collectButton.style.borderRadius = '5px';
                    collectButton.style.cursor = 'pointer';
                    container.appendChild(collectButton);
                    collectButton.addEventListener('click', () => {
                        playSound();
                        flashScreen();
                        score += trail.length;
                        scoreDisplay.textContent = `Score: ${score}`;
                        trail.forEach((trailLetter) => {
                            trailLetter.style.transition = 'transform 1s, left 1s, top 1s, opacity 1s';
                            trailLetter.style.left = Math.random() * 100 + 'vw';
                            trailLetter.style.top = Math.random() * 100 + 'vh';
                            trailLetter.style.transform = 'scale(1)';
                            trailLetter.style.opacity = '0';
                            trailLetter.style.pointerEvents = 'none';
                            setTimeout(() => {
                                trailLetter.remove();
                            }, 1000);
                        });
                        for (let i = 0; i < trail.length; i++) {
                            const graveImage = document.createElement('img');
                            graveImage.src = './grave2.png';
                            graveImage.style.position = 'absolute';
                            graveImage.style.width = '36px'; // Match the font size of letters
                            graveImage.style.height = '36px';
                            graveImage.style.left = Math.random() * 100 + 'vw';
                            graveImage.style.top = Math.random() * 100 + 'vh';
                            body.appendChild(graveImage);
                        }
                        trail = [];
                        trailContainer.textContent = '';
                        definitionContainer.textContent = '';
                        if (collectButton) {
                            collectButton.style.display = 'none';
                        }
                        updateFreeButtonOpacity();
                    });
                }
                collectButton.style.display = 'block';
            } catch (error) {
                console.error('Error fetching definition:', error);
                definitionContainer.textContent = '';
                if (collectButton) {
                    collectButton.style.display = 'none';
                }
            }
        }

        // document.addEventListener('mousemove', () => {
        //     if (trail.length >= 2) {
        //         checkWordAndDisplay();
        //     }
        // });

        freeButton.style.opacity = '0.05';

        function updateFreeButtonOpacity() {
            if (trail.length >= 3) {
                const newOpacity = Math.min(0.05 + trail.length * 0.05, 1);
                freeButton.style.opacity = newOpacity.toString();
                freeButton.style.display = 'block';
            } else {
                freeButton.style.display = 'none';
            }
        }

        function createLetter() {
            const letter = document.createElement('div');
            letter.className = 'letter';
            letter.textContent = letters[Math.floor(Math.random() * letters.length)];
            letter.style.left = Math.random() * 100 + 'vw';
            letter.style.top = Math.random() * 100 + 'vh';
            body.appendChild(letter);

            letter.addEventListener('mouseover', function() {
                if (!trail.includes(letter) && !letter.style.pointerEvents.includes('none')) {
                    trail.push(letter);
                    letter.style.transform = 'scale(1)'; // Remove jitter effect
                    letter.style.cursor = 'default'; // Prevent further interaction
                    letter.style.pointerEvents = 'none'; // Disable further events
                    updateFreeButtonOpacity(); // Update opacity with each letter collected
                    checkWordAndDisplay(); // Run when a new letter is collected
                    const onMouseMove = (e) => {
                        let prevX = e.pageX;
                        let prevY = e.pageY;
                        trail.forEach((trailLetter, index) => {
                            setTimeout(() => {
                                const currentX = trailLetter.style.left;
                                const currentY = trailLetter.style.top;
                                trailLetter.style.left = prevX + 'px';
                                trailLetter.style.top = prevY + 'px';
                                prevX = parseFloat(currentX);
                                prevY = parseFloat(currentY);
                            }, index * 50); // Delay each letter by 50ms
                        });
                        trailContainer.textContent = trail.map(l => l.textContent).join('');
                        if (trail.length >= 2) {
                            freeButton.style.display = 'block';
                            freeButton.style.transform = `translate(-50%, -50%) scale(${1 + trail.length * 0.1})`;
                            freeButton.style.padding = `${5 + trail.length}px ${10 + trail.length * 2}px`;
                            freeButton.style.fontSize = `${6 + trail.length}px`;
                        }
                    };
                    document.addEventListener('mousemove', onMouseMove);
                }
            });
        }

        for (let i = 0; i < numLetters; i++) {
            createLetter();
        }

        setInterval(createLetter, 2000);

        container.style.gap = '8px';
        container.style.width = '320px';
        container.style.backgroundColor = 'white';
        container.style.zIndex = '10';
        container.style.justifyContent = 'center';
        container.style.alignItems = 'center';
        container.style.paddingBottom = '10px';
        container.style.borderRadius = '8px';

        container.insertBefore(scoreDisplay, trailContainer);

        // Remove top and left positioning
        trailContainer.style.top = '';
        trailContainer.style.left = '';
        definitionContainer.style.top = '';
        definitionContainer.style.left = '';

        const initialScreen = document.createElement('div');
        initialScreen.style.position = 'absolute';
        initialScreen.style.top = '0';
        initialScreen.style.left = '0';
        initialScreen.style.width = '100%';
        initialScreen.style.height = '100%';
        initialScreen.style.backgroundColor = 'pink';
        initialScreen.style.display = 'flex';
        initialScreen.style.flexDirection = 'column';
        initialScreen.style.justifyContent = 'center';
        initialScreen.style.alignItems = 'center';
        initialScreen.style.zIndex = '20';
        initialScreen.style.fontFamily = 'Comic Sans MS, cursive, sans-serif';

        const title = document.createElement('h1');
        title.textContent = "Bernie's Super Fun Word Hunt!";
        title.style.color = 'purple';
        title.style.fontSize = '48px';
        title.style.textShadow = '2px 2px yellow';
        initialScreen.appendChild(title);

        const playButton = document.createElement('button');
        playButton.textContent = 'PLAY!!!!';
        playButton.style.padding = '20px 40px';
        playButton.style.fontSize = '36px';
        playButton.style.backgroundColor = 'lime';
        playButton.style.color = 'blue';
        playButton.style.border = '5px dashed red';
        playButton.style.borderRadius = '10px';
        playButton.style.cursor = 'pointer';
        playButton.style.boxShadow = '0 0 10px orange';
        playButton.addEventListener('click', () => {
            initialScreen.style.display = 'none';
        });
        initialScreen.appendChild(playButton);

        body.appendChild(initialScreen);

        function playBackgroundMusic() {
            const audio = new Audio('./scary.mp3');
            audio.loop = true;
            audio.play();
        }

        playButton.addEventListener('click', () => {
            initialScreen.style.display = 'none';
            playBackgroundMusic();
        });
    </script>
</body>
</html>
